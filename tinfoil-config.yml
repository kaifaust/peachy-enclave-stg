# Tinfoil Container definition for the STAGING assistant enclave.
#
# This file HAS been deployed from: stg-v0.0.1 came up, attested and was torn
# down on 2026-09-19, and stg-v0.0.2 turns the agent leaves on. It is still the
# shape of a staging enclave reviewed in git, so that bringing one up is a
# checklist rather than an evening of improvisation (docs/staging.md §The
# staging enclave) — but it is no longer hypothetical, and a change here is a
# change to something that has run.
#
# Read that section before changing a line here. The three things this file
# exists to guarantee, none of which are cosmetic:
#
#   1. A STAGING MEASUREMENT CAN NEVER BE MISTAKEN FOR THE PRODUCTION ONE.
#      @tinfoilsh/verifier reads `releases/latest` from whatever owner/repo it
#      is handed, and `tinfoil container create` defaults to
#      `--promote-release true`, which moves that pointer. So the moment a
#      staging release is cut into kaifaust/peachy-enclave, production's hourly
#      check (server/worker-attest.ts), pchy.app/verify in every visitor's
#      browser, and the iOS and macOS client verifications all begin comparing
#      the LIVE production enclave against a staging measurement and reporting
#      a mismatch. A separate tag series inside one repo does NOT help, because
#      `latest` is not tag-scoped. Hence: this file is released into a SECOND
#      public config repo, kaifaust/peachy-enclave-stg, and never into
#      kaifaust/peachy-enclave.
#
#   2. NO PATH TO PRODUCTION DATA. Every egress host below is a staging host,
#      and peachy-db's production hostname is deliberately absent — an enclave
#      cannot dial a name its measured allowlist does not carry. The secret
#      scoping is the other half of this, and it is the one genuinely
#      unresolved question: see docs/staging.md §The secret-scope collision.
#
#   3. THE SHAPE IS PRODUCTION'S SHAPE. Same cvm-version, same cpus/memory,
#      same read_only + tmpfs, same healthcheck, same shim. A staging enclave
#      that runs on a different shape rehearses a different system, exactly as
#      a staging Blueprint that rebuilds on a different path list would.
#
# Schema: github.com/tinfoilsh/tinfoil-config. Resources are measured and
# immutable; the decoder rejects unknown fields, wildcards and IP literals in
# `allow`, and any `image` without a digest.

cvm-version: 0.14.7

# The smallest shape on offer (2 cores / 8 GB), and the same one production
# runs. At $0.06/core/hr + $0.01/GB/hr that is $0.20 an hour — which is the
# whole argument for running this enclave EPHEMERALLY: a two-hour verification
# session costs about 40 cents, and a deleted container costs nothing.
# docs/staging.md §Cost has the arithmetic.
cpus: 2
memory: 8192

networks:
  egress:
    # Hostnames only, IPv4 only, re-resolved about every 60s, no wildcards.
    # RFC1918 is blocked regardless, which is why the Postgres host below must
    # be the EXTERNAL Render hostname rather than the internal `dpg-…-a` form.
    egress: allowlist
    allow:
      # peachy-db-stg's EXTERNAL hostname (created 2026-09-19; the internal
      # `dpg-…-a` form is RFC1918 and unreachable from an enclave). The
      # production instance's hostname —
      # dpg-d9jrmi67r5hc73ddemi0-a.oregon-postgres.render.com — MUST NOT appear
      # here, and a test asserts it does not. That absence is the structural
      # guarantee: a measured allowlist without production's database name in
      # it is an enclave that cannot reach production's database, whatever its
      # DATABASE_URL happens to say.
      - dpg-dank6lf40ujc73c7ki1g-a.oregon-postgres.render.com
      # The model provider. One, as in production.
      - inference.tinfoil.sh
      # Attestation of inference.tinfoil.sh at boot (server/tinfoil-attest.ts
      # via @tinfoilsh/verifier). These three hosts are the whole measured set;
      # re-measure after bumping the verifier, because a missing host here
      # fails closed as a 503 on every run.
      - github-proxy.tinfoil.sh
      - kds-proxy.tinfoil.sh
      # This container's own public hostname, which attestSelf dials to read
      # back its own attestation document. Worth noting for whoever reads this
      # next: under stg-v0.0.2 this process reached PRODUCTION's container at
      # peachy-assistant.peachy.containers.tinfoil.dev, which was NOT in this
      # list and never has been. So either that name resolves through a path
      # the allowlist does not cover, or sibling containers are reachable
      # regardless. Either way the allowlist did not stop it, and the thing
      # that stops it now is attestSelf refusing to default the host.
      - peachy-assistant-stg.peachy.containers.tinfoil.dev
      # The assistant's tools run in-process, so search_places' two outbound
      # legs are this process's egress: a text query goes to
      # places.googleapis.com and the current-location branch to
      # maps.googleapis.com. Both hosts or neither — the second one was missing
      # from production's list until 2026-09-18 and the failure was silent by
      # construction (docs/tinfoil-container.md §Measured egress).
      - places.googleapis.com
      - maps.googleapis.com
      # R2. The account's S3 endpoint, which staging shares with production —
      # the isolation is the BUCKET, not the account (docs/staging.md §Which
      # secrets must differ), and staging writes to peachy-media-stg and
      # peachy-identity-stg, created 2026-09-19.
      #
      # Production's list carries a second R2 entry, the public
      # `pub-….r2.dev` media host. Staging has none, deliberately: neither
      # staging bucket was given a managed public domain, staging serves no
      # media to a browser, and the worker reaches R2 through the S3 endpoint
      # above rather than through the public one. A host in a measured
      # allowlist that nothing dials is a claim about a vendor relationship
      # that does not exist, so it is left out. Give peachy-media-stg a public
      # domain some day and this is where it goes.
      - c6b00e1a7686e9f69631784067aef768.r2.cloudflarestorage.com

containers:
  - name: worker
    # PLACEHOLDER, and it stays one on main for the same reason production's
    # does: the digest is what the attestation commits to, so a copy-pasteable
    # non-zero digest here is a float waiting to happen. The release step
    # substitutes the real digest into the tagged copy in the staging config
    # repo.
    #
    # Note the tag series: `stg-v0.0.x`, never `v0.0.x`. The tags live in a
    # different repo from production's and the image tags should differ too,
    # so that a digest read off a job summary cannot be pasted into the wrong
    # release by muscle memory.
    image: ghcr.io/kaifaust/peachy-assistant:stg-v0.0.3@sha256:165687e8944f5ecd75531ddb8460cbdd32ef1e730a4a81c584048d2d4164b0b8
    networks: [egress]
    env:
      # server/db.ts productionSignal() keys off RENDER; keep the fail-safe
      # armed here exactly as production does.
      - RENDER: "1"
      # The one env value that differs from production's, and it is the one a
      # human reads first in a log line. Anything that reports which process it
      # is says `-stg` out loud.
      - RENDER_SERVICE_NAME: peachy-assistant-stg-tinfoil
      # Same pin as production: the cgroup files are not readable inside an
      # enclave, so server/container.ts takes its fail-safe of 2 and this
      # overrules it. Staging rehearses production's concurrency or it
      # rehearses nothing.
      - PEACHY_MAX_CONCURRENT_RUNS: "4"
      - PEACHY_HEALTH_PORT: "8080"
      - NODE_COMPILE_CACHE: /tmp/peachy-agent-cc
      # Public by design, and measured: which provider and which models read a
      # person's messages is part of what the attestation commits to. Keep
      # these identical to production's unless the POINT of the staging run is
      # to rehearse a model change — in which case changing them here, cutting
      # a staging release and reading the difference on /healthz/config IS the
      # rehearsal, and it is the cheapest one this tier buys.
      - PEACHY_INFERENCE_PROVIDER: tinfoil
      - PEACHY_TINFOIL_MODEL: glm-5-3-flash
      - PEACHY_TINFOIL_FAST_MODEL: deepseek-v4-1-flash
      # Both rung-2 flags on, as in production. The API side of each is set
      # separately in Doppler; either side alone is safe, because an unclaimed
      # job times out into the existing no-verdict path and fails OPEN.
      - PEACHY_TRIAGE_IN_WORKER: "1"
      - PEACHY_TAGGER_IN_WORKER: "1"
      # AGENT LEAVES, ON IN STAGING AND OFF IN PRODUCTION (2026-09-19). This
      # is the first thing the staging tier was built to rehearse, and the
      # reason it is measured rather than a `--variable` is that "does this
      # enclave hold a seat in people's groups" is exactly the kind of claim a
      # person should be able to read off an attestation rather than take on
      # trust. The production config does NOT carry this line, and a
      # docs-claims test ties production's copy to the transparency report's
      # `agent-leaves-in-production` marker — that test reads
      # deploy/tinfoil/tinfoil-config.yml only, so this line does not and must
      # not move it.
      #
      # The flag alone is not enough: server/agent-leaves.ts agentLeavesEnabled()
      # also requires enclaveRootKey() to be non-null and credentialsEnabled()
      # to be true, which is what the two extra secrets below supply. All three
      # or the runner stays off.
      - PEACHY_AGENT_LEAVES: "1"
      # WHICH ENCLAVE THIS PROCESS IS, STATED RATHER THAN DEFAULTED, and both
      # halves are required now (server/agent-leaves.ts attestSelf).
      #
      # stg-v0.0.2 stated neither, so the staging enclave dialled
      # PRODUCTION'S host, verified it against PRODUCTION'S config repo, and
      # recorded production's measurement (90f29d14…) and release tag (v0.1.7)
      # as its own. The first assistant it enrolled carried those in its
      # `pdc2`, and the same measurement became its sealing salt. The
      # attestation succeeded; it was simply about somebody else.
      #
      # A staging enclave stamping production's measurement into credentials is
      # the precise failure this whole tier is built to make impossible, so it
      # is now refused rather than defaulted.
      - PEACHY_WORKER_ENCLAVE_HOST: peachy-assistant-stg.peachy.containers.tinfoil.dev
      - PEACHY_WORKER_CONFIG_REPO: kaifaust/peachy-enclave-stg
      # The API's device PUBLIC key. This process signs no `pdc1` and CANNOT
      # — that is the whole point of the narrowing — but it still has to CHECK
      # one, because every member of every group the assistant sits in carries
      # one. Holding no device key, this is the only way it can.
      #
      # Measured rather than mounted, deliberately: it is a public key, and
      # which server keys a release trusts is exactly the sort of thing the
      # attestation should commit to. Staging's value is staging's own, so a
      # `pdc1` from production's API does not verify here and vice versa.
      - PEACHY_DEVICE_CREDENTIAL_PUBLIC_KEYS: 42S9V9+YGBU6c9TvsLZRikyQLaXnN5qbjvQ/U36Awpc=
    # STG_-PREFIXED, AND THAT PREFIX IS LOAD-BEARING. Every unprefixed name
    # below exists today as an ORGANIZATION secret holding a PRODUCTION value,
    # and an organization secret is resolvable by every repository in the
    # organization. So a staging container declaring plain `DATABASE_URL` would
    # resolve it from organization scope and connect to PRODUCTION'S DATABASE.
    #
    # The obvious fix — a repository secret of the same name, scoped to this
    # config repo — is refused: `409: secret name conflicts with another
    # scope`, measured 2026-09-19 (docs/staging.md §The secret-scope
    # collision). A name cannot be held at both scopes in one organization.
    #
    # So staging uses names that collide with nothing, held as REPOSITORY
    # secrets on kaifaust/peachy-enclave-stg, and the image's entrypoint
    # (deploy/tinfoil/stg-env-prefix.sh, a no-op in production) renames them
    # to what the process reads. That indirection is inside the image, the
    # image is pinned by digest, and the digest is what the attestation commits
    # to — so it is published and checkable, unlike the `--variable` route it
    # replaced.
    secrets:
      - STG_DATABASE_URL
      - STG_TINFOIL_API_KEY
      - STG_GOOGLE_MAPS_API_KEY
      - STG_R2_ACCOUNT_ID
      - STG_R2_ACCESS_KEY_ID
      - STG_R2_SECRET_ACCESS_KEY
      - STG_R2_BUCKET
      - STG_R2_PUBLIC_BASE_URL
      - STG_R2_PRIVATE_BUCKET
      # The agent-leaves pair, added for stg-v0.0.2. Both are generated FRESH
      # for staging, exist only as repository secrets on
      # kaifaust/peachy-enclave-stg, and are not production's values — staging
      # seals with its own root key against a throwaway database, so a sealed
      # row written here is unreadable by production and vice versa, which is
      # the property that makes a rehearsal safe to run at all.
      #
      # THE SECOND ONE IS THE NARROWED KEY, NOT THE DEVICE ROOT. Until
      # 2026-09-19 enrolling an assistant needed the seed that signs ALL device
      # credentials, so an enclave holding it could sign a `pdc1` for any
      # device of any actor. 01faee6a replaced that with an HKDF-SHA256
      # derivative published for use `agent`, which every verifier — server and
      # all four clients, offline — refuses to accept on a `pdc1`.
      #
      # So staging mounts the DERIVED seed and never the root. Staging's root
      # exists only on the laptop that generated it, which is what lets this
      # tier rehearse the refusal honestly: an enclave that was handed the root
      # anyway would pass a test that proves nothing.
      - STG_PEACHY_AGENT_ROOT_KEY
      - STG_PEACHY_AGENT_CREDENTIAL_KEY
    read_only: true
    tmpfs:
      /tmp: "size=1g,mode=1777"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: always
    stop_signal: SIGTERM
    stop_timeout: 30

# Mandatory — a deployment must forward something. Only the two health paths
# are exposed; there is no inbound rpc surface by design, because the worker's
# inputs and outputs cross Postgres.
shim:
  upstream-port: 8080
  paths:
    - /healthz
    - /healthz/config
